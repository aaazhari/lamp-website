    <!-- 1. Grind Screen -->
    <div class="screen active" id="screen-grind">
        <div class="station-bg"></div><div class="station-counter"></div>
        <div class="progress-hud">
            <div class="hud-text">Press and Hold to Grind</div>
            <div class="progress-bar"><div class="progress-target" style="left: 78%; width: 16%;"></div><div class="progress-fill" id="grind-fill"></div></div>
        </div>

        <div class="grinder-station">
            <div class="grind-hopper"><div class="grind-beans-bg" id="grind-beans-bg"></div></div>
            <div class="grind-body-top"><div class="grind-display" id="grind-timer">0.0</div></div>
            <div class="grind-body-mid">
                <div class="grind-chute"></div><div class="grind-fall" id="grind-fall"></div>
                <div class="grind-pf-container">
                    <div class="grind-handle"></div>
                    <div class="grind-pf-basket"><div class="grind-pile" id="grind-pile"></div></div>
                </div>
            </div>
        </div>
        <button class="power-btn state-off" id="btn-grind">
            <div class="power-icon-circle">
                <svg class="power-icon-svg" viewBox="0 0 24 24" fill="none" stroke="var(--white)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                </svg>
            </div>
            <span class="power-label" id="grind-label">OFF</span>
        </button>
    </div>

    <!-- 2. Extract Screen -->
    <div class="screen" id="screen-extract">
        <div class="station-bg"></div><div class="station-counter"></div>
        <div class="progress-hud">
            <div class="hud-text" id="extract-hud-text">Press and Hold to Extract</div>
            <div class="progress-bar"><div class="progress-target" style="left: 65%; width: 25%;"></div><div class="progress-fill" id="extract-fill"></div></div>
        </div>

        <div class="machine-container">
            <div class="machine-housing"></div>
            <div class="machine-top-row">
                <div class="machine-brand-pill">ESPRESSO</div>
                <div class="machine-dials"><div class="machine-dial"></div><div class="machine-dial"></div></div>
            </div>
            <div class="machine-lower-face"></div>
            <div class="wand-mount" style="left: 87%; top: 150px;"></div>
            
            <div class="group-unit">
                <div class="group-head"></div>
                <div class="pf-locked">
                    <div class="pf-locked-handle"></div>
                    <div class="pf-locked-basket"><div class="pf-locked-puck"></div></div>
                    <div class="pf-spouts">
                        <div class="pf-spout"><div class="spout-stream" id="stream"></div></div>
                        <div class="pf-spout"><div class="spout-stream" id="stream-2"></div></div>
                    </div>
                </div>
            </div>
            <div class="group-head-secondary"></div>
            <div class="drip-platform">
                <div class="demitasse">
                    <div class="demitasse-cup"><div class="cup-coffee-fill" id="liquid"></div></div>
                    <div class="demitasse-handle">
                        <svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 4 8 C 26 4, 36 16, 36 25 C 36 34, 26 46, 4 42" fill="none" stroke="var(--outline)" stroke-width="18" stroke-linecap="round"/>
                            <path d="M 4 8 C 26 4, 36 16, 36 25 C 36 34, 26 46, 4 42" fill="none" stroke="var(--white)" stroke-width="8" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="demitasse-saucer"></div>
                </div>
                <div class="drip-tray">
                    <div class="drip-tray-slats">
                        <div class="slat"></div><div class="slat"></div><div class="slat"></div>
                        <div class="slat"></div><div class="slat"></div><div class="slat"></div>
                        <div class="slat"></div><div class="slat"></div>
                    </div>
                </div>
            </div>
        </div>
        <button class="power-btn state-off" id="btn-extract">
            <div class="power-icon-circle">
                <svg class="power-icon-svg" viewBox="0 0 24 24" fill="none" stroke="var(--white)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                </svg>
            </div>
            <span class="power-label" id="extract-label">OFF</span>
        </button>
    </div>

    <!-- 3. Steam Screen -->
    <div class="screen" id="screen-steam">
        <div class="station-bg"></div><div class="station-counter"></div>
        <div class="progress-hud">
            <div class="hud-text" id="steam-hud-text">Move the Pitcher Under the Wand</div>
            <div class="progress-bar"><div class="progress-target" style="left: 65%; width: 10%;"></div><div class="progress-fill" id="temp-fill"></div></div>
        </div>

        <div class="steam-container" id="steam-container">
            <div class="steam-panel"></div>
            <div class="wand-mount"></div>
            <div class="wand-target-zone"></div>
            <div class="pitcher-drag-zone" id="pitcher-drag-zone">
                <div class="pitcher-simple" id="pitcher-simple">
                    <div class="heat-haze" id="heat-haze"></div>
                    <div class="milk-fill" id="milk-surface"></div>
                    <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
                      <defs>
                        <linearGradient id="pg-body" x1="0" y1="0" x2="1" y2="0">

                      <ellipse cx="58" cy="70" rx="12" ry="4" fill="rgba(255,255,255,0.7)"/>
                      <ellipse cx="80" cy="71" rx="8"  ry="3" fill="rgba(255,255,255,0.5)"/>
                      <g id="pg-bubbles"></g>
                      <ellipse cx="70" cy="52" rx="42" ry="11" fill="#3D2B1F"/>
                      <ellipse cx="70" cy="50" rx="40" ry="10" fill="url(#pg-rim)"/>
                      <path d="M 30 50 Q 70 62 110 50 Q 110 56 70 68 Q 30 56 30 50 Z" fill="#5a6468" opacity="0.6"/>
                      <ellipse cx="70" cy="50" rx="34" ry="8" fill="#1c2226"/>

                      <path d="M 32 46 L 10 50 L 32 56 Z" fill="#3D2B1F"/>
                      <path d="M 33 47 L 14 50 L 33 54 Z" fill="url(#pg-rim)"/>
                      <path d="M 22 90  Q 70 98  118 90"  fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
                      <path d="M 20 110 Q 70 118 120 110" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                      <path d="M 48 54 Q 46 80 46 110 Q 46 130 48 140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Pouring Stage (Draggable) -->
    <div class="screen" id="screen-pour">
        <div class="station-bg"></div><div class="station-counter"></div>
        <div class="progress-hud">
            <div class="hud-text" id="pour-hud-text">Drag Pitcher to Pour</div>
            <div class="progress-bar"><div class="progress-target" style="left: 70%; width: 25%;"></div><div class="progress-fill" id="pour-fill"></div></div>
        </div>

        <div class="art-layout">
            <div class="coaster">
                <div class="pour-demitasse-wrap">
                    <div class="demitasse">
                        <div class="demitasse-cup">
                            <div class="cup-coffee-fill" id="pour-base-liquid">
                                <svg class="pour-logo" viewBox="0 0 160 122" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
                                    <line x1="32" y1="23" x2="50" y2="23" stroke="#4A2C1A" stroke-width="2.5" stroke-linecap="round"/>
                                    <text x="30" y="45" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="23" letter-spacing="3" fill="#4A2C1A">OV</text>
                                    <text x="30" y="71" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="23" letter-spacing="3" fill="#4A2C1A">ER</text>
                                    <text x="65" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="23" letter-spacing="1.5" fill="#4A2C1A">DOSE</text>
                                    <line x1="32" y1="104" x2="50" y2="104" stroke="#4A2C1A" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="demitasse-handle">
                            <svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
                                <path d="M 4 8 C 26 4, 36 16, 36 25 C 36 34, 26 46, 4 42" fill="none" stroke="var(--outline)" stroke-width="18" stroke-linecap="round"/>
                                <path d="M 4 8 C 26 4, 36 16, 36 25 C 36 34, 26 46, 4 42" fill="none" stroke="var(--white)" stroke-width="8" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div id="pour-stream"></div>

                    <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
                      <defs>
                        <linearGradient id="pg-body-p" x1="0" y1="0" x2="1" y2="0">

                          <stop offset="0%"   stop-color="#ffffff"/><stop offset="100%" stop-color="#f0ece0"/>

                      </defs>

                      <path d="M 108 72 C 136 72, 142 84, 142 100 C 142 116, 136 130, 108 130" fill="none" stroke="#3D2B1F" stroke-width="14" stroke-linecap="round"/>
